name: bocker-gui
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
section: default
priority: extra
maintainer: Bocker Maintainers <maintainers@example.com>
description: Bocker GUI
contents:
  - src: ./gui/build/linux/x64/release/bundle/
    dst: /opt/bocker-gui
    type: tree
  - src: ./gui/bocker_gui.desktop
    dst: /usr/share/applications/bocker_gui.desktop
