name: bocker-gui
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
section: default
priority: extra
maintainer: Bocker Maintainers <maintainers@example.com>
description: Bocker GUI
depends:
  - iproute2
  - util-linux
  - dnsmasq-base
  - rsync
  - tar
  - squashfs-tools
  - xz-utils
  - attr
scripts:
  postinstall: ./build/postinstall.sh
  preremove: ./build/preremove.sh
  postremove: ./build/postremove.sh
contents:
  - src: ./gui/build/linux/x64/release/bundle/
    dst: /usr/lib/bocker-gui
    type: tree
  - src: ./gui/bocker_gui.desktop
    dst: /usr/share/applications/io.bocker.bocker_gui.desktop
    file_info:
      mode: 0644
  - src: ./logo.png
    dst: /usr/share/pixmaps/io.bocker.bocker_gui.png
    file_info:
      mode: 0644
