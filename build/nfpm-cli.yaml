name: bocker
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
section: default
priority: extra
maintainer: Bocker Maintainers <maintainers@example.com>
description: Bocker CLI
depends:
  - iproute2
  - util-linux
  - dnsmasq-base
  - rsync
  - tar
  - squashfs-tools
  - xz-utils
  - attr
scripts:
  postinstall: ./build/postinstall.sh
  preremove: ./build/preremove.sh
  postremove: ./build/postremove.sh
contents:
  - src: ./bocker
    dst: /usr/bin/bocker
    file_info:
      mode: 0755
  - src: ./completions/bocker
    dst: /usr/share/bash-completion/completions/bocker
    file_info:
      mode: 0644
