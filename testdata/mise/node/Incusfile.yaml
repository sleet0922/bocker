version: 1
args:
  NODE_VERSION: "24.19.0"
mirror: china
name: bocker-mise-node-e2e
network: nat
stages:
  - name: builder
    from: debian/13
    steps:
      - mise: {tool: node, version: "${NODE_VERSION}"}
      - workdir: /src
      - copy: {sources: [package.json, app.js, app.test.js], destination: /src/}
      - shell: |
          set -eu
          mkdir -p /out
          npm test
          node app.js > /out/result.json
          node --version > /out/version.txt
  - from: debian/13
    steps:
      - workdir: /opt/bocker-mise-test
      - copy: {from: builder, sources: [/out/result.json, /out/version.txt], destination: ./}
      - shell: |
          set -eu
          grep -Fx 'v24.19.0' version.txt
          grep -F '"language":"node"' result.json
          test ! -e /opt/bocker-mise
    runtime: {autostart: false}
